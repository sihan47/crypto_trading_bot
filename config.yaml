strategy:
  name: gpt
  params:
    context_hours: 24
    provider: openai
    show_prompt: true
    mode: live
    gpt_authority: 0.2
    engine: regime_v2
    ensemble:
      trend_weight: 0.4
      breakout_weight: 0.3
      reversion_weight: 0.3
      entry_threshold: 60
      exit_threshold: 55
      min_coverage: 0.25
      min_margin: 10
      max_atr_pct: 0.018
      atr_percentile_limit: 0.85
ai:
  openai:
    model: gpt-6.1-sol
    reasoning_effort: low
    max_completion_tokens: 2048
  news:
    model: gpt-5-nano
    reasoning_effort: minimal
    max_completion_tokens: 2048
    cache_seconds: 1800
data:
  symbol: BTCUSDT
  timeframe: 4h
  lookback: 1000
  start: '2022-09-01'
  end: '2026-05-01'
trading:
  execution_mode: shadow
  order_quantity: 0.0005
  account_type: spot

# Multi-symbol trading: each entry overrides the global order_quantity.
# Remove or comment out entries you don't want to trade.
symbols:
  - symbol: BTCUSDT
    order_quantity: 0.0005
  - symbol: BNBUSDT
    order_quantity: 0.05
